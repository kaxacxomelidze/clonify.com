services:

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: https://clonyfy.com
    container_name: clonify-frontend
    restart: unless-stopped
    expose:
      - "3000"

  backend:
    build:
      context: ./backend
    container_name: clonify-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    volumes:
      - ./storage/clones:/data/output
      - ./storage/object-store:/data/storage
    expose:
      - "5000"
    networks:
      - default
      - clonify-db

  nginx:
    image: nginx:1.28-alpine
    container_name: clonify-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

networks:
  clonify-db:
    external: true
