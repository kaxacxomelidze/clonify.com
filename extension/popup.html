<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Clonyfy Helper</title>
  <link rel="stylesheet" href="ui.css">
  <style>body { width: 300px; } .card { padding: 16px; } h1 { font-size: 16px; margin: 12px 0 6px; } a { color: var(--text); text-underline-offset: 3px; }</style>
</head>
<body>
  <main class="card">
    <header class="brand"><img src="icons/icon32.png" alt="" width="20" height="20"> Clonyfy Helper</header>
    <h1>Ready</h1>
    <p class="status">When a site blocks Clonyfy's servers, start the clone on <a href="https://clonyfy.com/dashboard" target="_blank" rel="noreferrer">clonyfy.com</a> as usual — the helper captures the page from your browser.</p>
    <p class="status">It never sends cookies, logins or personal data, and does nothing in the background.</p>
  </main>
</body>
</html>
