server {
    listen 80;
    server_name clonyfy.com www.clonyfy.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://clonyfy.com$request_uri;
    }
}

# Interactive clone previews run the cloned site's own JavaScript, so they live on a
# separate origin that holds no logins. Only preview paths are forwarded; the backend
# also refuses everything else on this host (PREVIEW_ORIGIN in backend/.env.production).
# Needs a DNS A record for preview.clonyfy.com and a certificate covering it, e.g.:
#   certbot certonly --webroot -w ./certbot/www -d clonyfy.com -d www.clonyfy.com -d preview.clonyfy.com --expand
server {
    listen 80;
    server_name preview.clonyfy.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://preview.clonyfy.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name preview.clonyfy.com;

    # Look the containers up through Docker's DNS on each request (cached 10s). With a fixed
    # proxy_pass host nginx resolves it once at startup, so after a deploy recreates the
    # frontend/backend containers (new IPs) every request returned 502 until nginx restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:5000;
    set $frontend_upstream http://frontend:3000;

    ssl_certificate /etc/letsencrypt/live/clonyfy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clonyfy.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # No X-Frame-Options here: the dashboard embeds these pages (backend sends CSP frame-ancestors).
    # Every path goes to the backend: the cloned site's own JS loads its files from their
    # ORIGINAL paths (/assets/app-….js, /__clonyfy_cdn/<host>/…), which the backend serves
    # from the clone's captured copies. Blocking them here (404) stopped the site's JS, so
    # text animations, dropdown animations and buttons never ran. The backend itself refuses
    # anything on this host that is not a preview page or a captured file.
    location / {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

server {
    listen 443 ssl;
    http2 on;

    server_name clonyfy.com www.clonyfy.com;

    # Look the containers up through Docker's DNS on each request (cached 10s). With a fixed
    # proxy_pass host nginx resolves it once at startup, so after a deploy recreates the
    # frontend/backend containers (new IPs) every request returned 502 until nginx restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:5000;
    set $frontend_upstream http://frontend:3000;

    # One canonical host: www duplicates every page for search engines.
    if ($host = www.clonyfy.com) {
        return 301 https://clonyfy.com$request_uri;
    }

    # Apple Pay domain verification for Whop's embedded checkout. The file comes
    # from Whop (Payments → Verify domain) and lives in certbot/www/.well-known/.
    location = /.well-known/apple-developer-merchantid-domain-association {
        root /var/www/certbot;
        default_type text/plain;
    }

    ssl_certificate /etc/letsencrypt/live/clonyfy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clonyfy.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # Compress text responses (JS bundles shrink ~70%). Images/zips are already compressed.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml font/ttf application/vnd.ms-fontobject;

    client_max_body_size 50m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }

    location /share/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1200s;
    }

    location /_assets/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /robots.txt {
        proxy_pass $backend_upstream;
    }

    location = /sitemap.xml {
        proxy_pass $backend_upstream;
    }

    location / {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
