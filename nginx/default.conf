# --- treading.clonyfy.com (trade-api: TradingView webhook + dashboard) [managed by trade/deploy/enable-https.sh] ---
server {
    listen 80;
    server_name treading.clonyfy.com;

    location /.well-known/acme-challenge/ {
        root /var/www/casino-acme;
    }

    location / {
        return 301 https://treading.clonyfy.com$request_uri;
    }
}

server {
    listen 443 ssl; # trade:treading.clonyfy.com
    http2 on;
    server_name treading.clonyfy.com;

    ssl_certificate     /etc/nginx/casino-le/live/treading.clonyfy.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/casino-le/live/treading.clonyfy.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # variable upstream: nginx still starts if trade-api is down
    set $trade_upstream http://trade-api:8000;

    location /.well-known/acme-challenge/ {
        root /var/www/casino-acme;
    }

    location /webhook/ {
        resolver 127.0.0.11 valid=30s;
        client_max_body_size 32k;
        proxy_pass $trade_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }

    location / {
        resolver 127.0.0.11 valid=30s;
        client_max_body_size 64k;
        proxy_pass $trade_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}