server {
    listen 80;
    server_name clonyfy.com www.clonyfy.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://clonyfy.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;

    server_name clonyfy.com www.clonyfy.com;

    ssl_certificate /etc/letsencrypt/live/clonyfy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clonyfy.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    client_max_body_size 50m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }

    location /share/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1200s;
    }

    location /_assets/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /robots.txt {
        proxy_pass http://backend:5000;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:5000;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
